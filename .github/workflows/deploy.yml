name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commits pushed with the default GITHUB_TOKEN (like the one
  # contributions.yml makes) deliberately do NOT trigger other `push`
  # workflows — GitHub's loop-prevention. workflow_run is the standard way
  # to chain onto that anyway, so the contribution-data refresh actually
  # results in a redeploy instead of silently going stale.
  workflow_run:
    workflows: ['Refresh GitHub contributions']
    types: [completed]

# Permissions the GITHUB_TOKEN needs to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if this run was chained from a failed contribution-data refresh.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Force the Pages source to "GitHub Actions" (build_type: workflow).
      # configure-pages' enablement alone does not convert an existing
      # "deploy from a branch" site, which lets a Jekyll branch build race the
      # artifact and serve the raw source index.html. This PUT runs on the
      # runner (which can reach the Pages API) and makes the switch stick.
      - name: Force Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> HTTP $code"
          # 404 means the site isn't created yet; configure-pages below creates it.
          if [ "$code" = "404" ]; then echo "Pages not yet created; will be enabled next."; fi
          cat /tmp/pages.json 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
